<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eee8dc">
  <meta name="description" content="A small home. A shy tenant. A quiet moment to play.">
  <title>The Sleepy Tenant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><p class="eyebrow">A LITTLE MOMENT OF QUIET</p><h1>The Sleepy Tenant</h1><p class="intro">Someone small has made themselves at home.</p></header>
  <main>
    <canvas id="scene" tabindex="-1" role="img" aria-label="A sleepy tenant lives in a ceramic cup on a saucer." aria-describedby="hint"></canvas>
    <button class="object-control" data-object="mug" type="button" aria-label="Mug. Enter to lift or place. Arrow keys to move." aria-pressed="false">Mug</button>
    <button class="object-control" data-object="tray" type="button" aria-label="Saucer. Arrow keys to slide." aria-pressed="false">Saucer</button>
    <button class="object-control" data-object="pet" type="button" aria-label="Sleepy tenant. Enter for a gentle stroke. Shift Enter for a quick poke." aria-pressed="false">Sleepy tenant</button>
  </main>
  <footer><p id="mood" aria-hidden="true">a small home. a very sleepy tenant.</p><div class="instruction"><span class="gesture" aria-hidden="true">↔</span><p id="hint">Lift the cup. Stroke a sleepy head.</p></div><p class="keys">Tab to choose <span>·</span> Arrows to move <span>·</span> Enter to lift or place</p><div class="controls"><button id="sound" type="button" aria-pressed="false" aria-label="Enable sound">Sound off</button><button id="pause" type="button" aria-pressed="false">Pause</button></div><span id="announcement" class="sr-only" aria-live="polite"></span></footer>
  <script src="assets/purr.js"></script>
  <script src="assets/foley.js"></script>
  <script src="audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
