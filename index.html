<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eee8dc">
  <meta name="description" content="A small home. A shy tenant. A quiet moment to play.">
  <title>The Sleepy Tenant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><p class="eyebrow">A LITTLE MOMENT OF QUIET</p><h1>The Sleepy Tenant</h1><p class="intro">Someone small has made themselves at home.</p></header>
  <main>
    <canvas id="scene" tabindex="0" role="application" aria-label="The Sleepy Tenant. Drag the saucer gently to meet its tenant. Quick movement makes them hide. Use arrow keys to move, Space to pause and Home to settle the saucer." aria-describedby="hint"></canvas>
  </main>
  <footer><p id="mood" aria-hidden="true">a very small someone, almost awake</p><div class="instruction"><span class="gesture" aria-hidden="true">↔</span><p id="hint">Gently drag the saucer. Give them a little time.</p></div><p class="keys">Arrow keys to move <span>·</span> Space to pause <span>·</span> Home to settle</p><div class="controls"><button id="sound" type="button" aria-pressed="false" aria-label="Enable sound">Sound off</button><button id="pause" type="button" aria-pressed="false">Pause</button></div><span id="announcement" class="sr-only" aria-live="polite"></span></footer>
  <script src="audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
